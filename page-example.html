<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title data-i18n="page.title">Mi sitio multilenguaje</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="d-flex justify-content-end mb-3">
      <select id="languageSelector" class="form-select w-auto">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="text-center mb-4">
      <h1 data-i18n="home.title">Bienvenido a nuestra aplicación</h1>
      <p data-i18n="home.description">
        Esta es una plataforma intuitiva para médicos.
      </p>
    </div>

    <div class="text-center">
      <button class="btn btn-primary" id="loginBtn" data-i18n="button.login">Iniciar sesión</button>
    </div>
  </div>

  <script>
    let translations = {};

    async function loadTranslations(lang) {
      const res = await fetch(`${lang}.json`);
      translations = await res.json();
      applyTranslations();
    }

    function applyTranslations() {
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (translations[key]) {
          el.textContent = translations[key];
        }
      });
    }

    document.getElementById("languageSelector").addEventListener("change", (e) => {
      const selectedLang = e.target.value;
      loadTranslations(selectedLang);
    });

    // Cargar idioma por defecto
    loadTranslations("es");
  </script>
</body>
</html>
